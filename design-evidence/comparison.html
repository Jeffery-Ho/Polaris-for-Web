<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Support page visual comparison</title>
    <style>
      body { margin: 24px; background: #eceff5; color: #081b43; font-family: system-ui, sans-serif; }
      main { display: grid; gap: 24px; margin: 0 auto; max-width: 1536px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; font-weight: 700; }
      img { display: block; width: 100%; background: white; box-shadow: 0 8px 30px rgba(0, 0, 0, .12); }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Selected visual reference</figcaption>
        <img src="support-reference.png" alt="Selected support page reference">
      </figure>
      <figure>
        <figcaption>Rendered implementation</figcaption>
        <img src="support-desktop.jpg" alt="Rendered support page">
      </figure>
    </main>
  </body>
</html>
